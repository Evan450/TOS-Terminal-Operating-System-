--[[ OPPM repository index for TOS.

     This branch exists for ONE reason: OPPM hardcodes the branch name
     `master` when it fetches a repo's programs.cfg
     (https://raw.githubusercontent.com/<repo>/master/programs.cfg), so a
     project whose branches are main/dev/optional-utilities is invisible to
     `oppm register` and `oppm install`. TOS itself reads OPPM repos as one
     of its four manifest formats -- being absent from one was an irony
     worth two files.

     There is no TOS source on this branch and there should never be. The
     package below installs the network BOOTSTRAP, which then downloads the
     real release from `main`. Branches:

       main                 the release build (what bootstrap downloads)
       dev                  the source tree -- open pull requests here
       optional-utilities   the signed add-on pack, a pkg repo
       master               this stub

     The `master/` prefix on each files key is the BRANCH SEGMENT of the raw
     URL, not a directory named master -- oppm fetches
     raw.githubusercontent.com/<repo>/<key>. So this file's key resolves to
     tos/bootstrap.lua on this branch.
]]
{
  ["tos"] = {
    files = {
      ["master/tos/bootstrap.lua"] = "/bin",
    },
    name = "TOS (installer)",
    description = "Network installer for TOS, a multi-user OS for OpenComputers: logins, per-user permissions, a capability sandbox, signed packages, encrypted mesh. Installs the OS itself from the main branch; needs an Internet Card.",
    authors = "Evan450",
    note = "This package installs the bootstrap only. Run 'bootstrap' to fetch and install TOS (~1.5 MB, needs a Tier 2 disk). Requires OpenComputers 1.7.5+ and a Lua 5.3 or 5.4 CPU.",
    repo = "tree/master/tos",
  },
}
