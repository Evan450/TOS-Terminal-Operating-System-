name: CI

# The suite CONTRIBUTING.md calls the contract ("FAIL=0"), run on every push to
# dev and every pull request. Needs no secrets and no Minecraft: it is pure Lua
# against fakes, plus the Python build tests. The two tests that need the
# monorepo's vendored Reference/ tree report as skipped, not failed.
#
# Only `dev` is built here. `main` and `optional-utilities` are generated by
# the publisher, so a red check on them would be about the generator, not a
# change a contributor made.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-branch:
    # CONTRIBUTING.md's first rule. GitHub bases a new pull request on the
    # DEFAULT branch, which is dev, but a fork's page or an old link can still
    # aim at main, and main is overwritten by the next release build. This
    # fails the check with the fix spelled out; it does not close the PR.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the base branch
        run: |
          echo "::error title=Wrong base branch::main is a generated release build and is overwritten by the next release. Please change this pull request's base branch to dev (Edit, next to the title). Nothing else needs to change."
          exit 1

  tests:
    if: github.event_name == 'push' || github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.3 and the Python test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3 python3-pytest python3-yaml
          # run_tests.py spawns `lua`; Debian provides it through an alternative
          # that is not always set, so make sure the name resolves.
          command -v lua >/dev/null || sudo ln -s "$(command -v lua5.3)" /usr/local/bin/lua
          lua -v
      - name: Run the suite
        run: python3 run_tests.py
