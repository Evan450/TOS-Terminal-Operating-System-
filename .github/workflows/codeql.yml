name: CodeQL

# Code scanning for the parts of the dev branch CodeQL can read: the GitHub
# workflows (the issue-triage bot handles text from strangers, which makes it
# the one real attack surface here), the Python build and test tools, and the
# Java headless runner. CodeQL cannot read Lua, so TOS itself is not covered;
# its own test suite and the headless runner are what check it.
#
# Only `dev` is scanned. GitHub's "default setup" scanned main too, and main
# is the generated release payload, Lua and docs with nothing CodeQL reads, so
# every release publish failed all three jobs and emailed the owner. This file
# replaced the default setup on 2026-11-06 for that reason.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, java-kotlin]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
