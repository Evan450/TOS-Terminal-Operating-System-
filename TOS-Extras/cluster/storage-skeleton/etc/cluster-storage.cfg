-- Storage Node configuration (protocol spec §4.5–§5).
-- Serialized data, never executed.
--
-- The node holds THREE ports open: the kernel's own, `write_port` and
-- `read_port`. That needs a wired modem or a Tier-2 wireless card; a
-- Tier-1 wireless card holds one, and the daemon will say it could not
-- open these. Changing either port needs the Master (write_port) and the
-- Workers (read_port) told to match -- they are fixed by the protocol
-- spec (§2.1), so leave them unless you are running a private variant.
--
-- `master` and `managers` are OPERATOR-DECLARED on purpose. §4.6's
-- namespace rules turn entirely on who the writer is, so a node that
-- believed a peer's own claim about its domain_id would have no
-- isolation at all -- the claim is the thing being checked.
return {
  root           = "/var/cluster-store",
  capacity       = 0,          -- 0 = use the whole filesystem
  write_port     = 2101,       -- TOS protocol, TRUSTED  (§2.1)
  read_port      = 2100,       -- lightweight reads, open (§2.1, §2.2)
  sweep_interval = 60,         -- expired-key sweep, seconds (§7)

  -- Address of the Master. Writes to shared/ and job-<id>/ come from it.
  master   = nil,

  -- Managers that may write their own domain-<id>/ scratch.
  --   ["<modem-address>"] = <domain_id>,
  managers = {},
}
