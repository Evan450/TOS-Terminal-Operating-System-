-- ╔══════════════════════════════════════════════════════════════╗
-- ║  /etc/cluster-master.cfg — Master daemon configuration       ║
-- ╚══════════════════════════════════════════════════════════════╝
-- Loaded by clusterd.start(). All fields have defaults; override only
-- what you need. Comments reference sections of the protocol spec.

return {
  -- Compute throughput ceiling for compute_bound assignments (§9.1).
  -- Match this to your server's `opencomputers.computer.threads` config.
  host_thread_budget = 4,

  -- Heartbeat cadence and degradation thresholds (§7).
  -- The daemon issues this value to Managers in CLUSTER_REGISTER_ACK;
  -- Managers heartbeat at this interval.
  heartbeat_interval       = 5,     -- seconds
  heartbeat_degraded_after = 15,    -- seconds without heartbeat
  heartbeat_offline_after  = 30,    -- seconds without heartbeat

  -- Daemon internal timers.
  scheduler_tick_interval  = 1,     -- how often the scheduler runs
  status_snapshot_interval = 2,     -- how often /var/cluster/status.dat is written
  heartbeat_sweep_interval = 5,     -- how often we scan for stale Managers

  -- Encryption policy (§3.3). v1 defaults to everything encrypted.
  -- Set plaintext_types to enable selective opt-out AFTER benchmarking.
  encryption = {
    plaintext_types = {},           -- e.g., { "CLUSTER_HEARTBEAT", "PEER_STATUS" }
  },

  -- Storage node — address of the single public storage node, if any.
  -- nil = no public tier; Master chunks inline or uses external storage.
  storage_node_address = nil,

  -- Storage POOL — several Storage Nodes (each running cluster-storage)
  -- sharing the Public tier, instead of one. Placement is a function of
  -- the key: job-<id>/ on two members, shared/ on all (standing at a
  -- majority), anything else on one. Every member's
  -- /etc/cluster-storage.cfg must name this Master. Overrides
  -- storage_node_address when set. Example:
  --   storage_pool = { "<node-a address>", "<node-b address>", "<node-c address>" },
  storage_pool = nil,
  storage_repair_interval = 120,    -- seconds; 0 = never repair shared/
}
