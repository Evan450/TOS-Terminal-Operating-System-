-- ╔══════════════════════════════════════════════════════════════╗
-- ║  /etc/rbmk.cfg — RBMK controller configuration (admin only)  ║
-- ╚══════════════════════════════════════════════════════════════╝
-- Returns a plain table. It is read with a text-only `load` in an EMPTY
-- environment — it is configuration, not a script: it cannot call
-- anything, and nothing it contains is executed beyond building this
-- table.
--
-- ── FIRST RUN ──────────────────────────────────────────────────────
-- Link an RBMK console (OC component `rbmk_console`) to the reactor, then:
--
--     rbmk survey
--
-- It shows the console's methods, whether it is linked to a core, and
-- one full scan of the core's channels. You want `usable: YES` and a
-- channel count that matches the reactor you built. Only then start the
-- service (it ships disabled): `service start rbmk-controld`.
--
-- Fill the loop with water first. A boiler below `waterMin` is a SCRAM
-- condition, and the SCRAM latch only clears by restarting the service.
return {
  -- Optional: pin a specific console by address prefix when more than
  -- one is linked. Leave nil to use the first candidate found.
  address = nil,

  -- A name for this reactor, carried in telemetry frames.
  name = "rbmk-1",

  -- Seconds between polls. Floors at 0.25s.
  pollInterval = 1,

  -- Seconds between CORE MAP reads. Independent of pollInterval on
  -- purpose: the safety poll must run as often as you asked, but
  -- re-reading every channel four times a second spends the machine's
  -- per-tick component budget on a picture no human can read that
  -- fast. Safety never waits on this.
  mapInterval = 1,

  -- Port the telemetry broadcast goes out on. Displays listen here;
  -- the controller NEVER opens it, so this adds no way in.
  telemetryPort = 2200,

  -- Hard-wired AZ-5 backup: the redstone SIDE to drive to 15 on SCRAM.
  -- Plan.md §Safety rule 2 wants a shutdown path that does not depend on
  -- the console method existing. Set this (0-5) once the line is built.
  az5RedstoneSide = nil,

  -- ── The core map ─────────────────────────────────────────────────
  -- The footprint the SKALA panel draws. HBM's RBMK is a square grid
  -- of up to 15x15 columns, which is the default and the honest one.
  -- `shape = "circle"` inscribes the round RBMK-1000 core instead, if
  -- you want the historical outline. Same posture as `limits` below: a
  -- value that would make an undrawable map falls back to the DEFAULT.
  grid = {
    w = 15,
    h = 15,
    shape = "square",     -- "square" | "circle"
  },

  -- ── The display wall ─────────────────────────────────────────────
  -- What each SCREEN on this machine shows under `rbmk skala --wall`.
  -- Keyed by seat number; unlisted seats follow the default rotation
  -- (map, params, alarms, trend, ...). Pages: "map", "panel",
  -- "alarms", "trend". Parameters: N power, T core temp, X steam,
  -- K rod depth, G coolant.
  --
  -- `pinned = true` exempts a seat from the alarm override, so it
  -- keeps its page during a SCRAM instead of switching to the alarm
  -- list. That is the operator saying "this is my working view and I
  -- accept it will not shout at me", which is why it is never a
  -- default.
  --
  -- OpenOS display satellites are NOT configured here — each one picks
  -- its own page from its own /etc/rbmk-display.cfg. Displays never
  -- register with the controller, so the machine that owns SCRAM has
  -- no inbound network path at all.
  wall = {
    -- [1] = { page = "map",   param = "T" },
    -- [2] = { page = "trend", param = "N", pinned = true },
  },

  -- Safety limits. Anything omitted, non-numeric or <= 0 falls back to
  -- the built-in DEFAULT — a typo can never silently DISABLE a limit.
  limits = {
    tempWarn   = 800,     -- hottest column hull, °C (the mod melts one at 1500)
    tempScram  = 1000,
    meltWarn   = 80,      -- hottest rod, % of ITS fuel's melting point
    meltScram  = 90,
    -- Total of every rod's flux this tick. These two are the one number
    -- here that is a first guess, not a measurement: watch `rbmk status`
    -- on a healthy run at full power and put them well above it.
    fluxWarn   = 8000,
    fluxScram  = 10000,
    waterMin   = 10,      -- lowest boiler feed tank, percent
    staleAfter = 5,       -- seconds without a reading => SCRAM
  },

  -- Which console driver to use. "hbm-ntm" is HBM's real rbmk_console
  -- (getColumnData / pressAZ5), read off the mod itself. "hbm-generic" is
  -- the old getter-per-reading guess, kept for a fork that has one.
  profileName = "hbm-ntm",

  -- Only for "hbm-generic" or a custom console: an explicit `profile`
  -- table here OVERRIDES profileName. If you are upgrading from a 0.x
  -- config that still has one, DELETE it -- its guessed method names do
  -- not exist on the real console and the service will refuse to start.
  -- profile = {
  --   temp = { "theRealName" }, flux = { ... }, scram = { ... },
  --   columns = { ... },
  -- },
}
