-- /etc/cluster-manager.cfg — Manager configuration.
-- Edit this file then start the daemon with `service start cluster-manager`.
return {
  -- REQUIRED. The hex address of the cluster Master's modem. Without
  -- this the daemon refuses to start (we don't want a Manager going
  -- looking for ANY peer that claims to be a Master; mis-registering
  -- could leak compute resources to an attacker who happens to spawn
  -- a "Master" on the same OC network).
  master_address           = nil,

  -- Optional. Defaults to /etc/hostname. Visible to the Master and
  -- shown in `cluster managers` output.
  hostname                 = nil,

  -- Workload profile. Influences the Master's scheduler:
  --   "compute_bound" — CPU-heavy; subject to host_thread_budget cap.
  --   "io_bound"      — mostly waiting on storage/network/peripherals.
  --   "mixed"         — default.
  compute_profile          = "mixed",

  -- Concurrent worker slots. Should match the number of physical
  -- CPU slots on this OC machine OR the number of OpenOS worker
  -- robots paired with this Manager. 4 is the canonical T2 server.
  worker_count             = 4,

  -- Optional. If you have a tape drive / JBOD / external storage on
  -- this node, declare its type so the scheduler can match jobs that
  -- specify storage_preference. Examples: "tape", "jbod", "raid".
  -- Sent at registration AND on every heartbeat, so editing this and
  -- restarting the service is enough — no re-pairing needed.
  storage_type             = nil,

  -- Optional. Size of that external storage in bytes, for display in
  -- `cluster managers`. Purely informational — the scheduler matches on
  -- storage_type and on the storage_used ratio, never on capacity.
  storage_capacity         = nil,

  -- Heartbeat clamps. The Master suggests an interval in the register
  -- ACK; these bound it so a misconfigured Master can't flood us or
  -- starve our liveness detection.
  min_heartbeat_seconds    = 2,
  max_heartbeat_seconds    = 30,

  -- How often to retry CLUSTER_REGISTER while unregistered. Don't set
  -- this too aggressively — a Master in a logging crashloop sees
  -- every retry as a fresh attempt.
  register_retry_seconds   = 10,

  -- ── OpenOS worker bridge (cluster v2) ──────────────────────────────
  -- Off by default: the Manager runs every task inline. Turn this on to
  -- offload tasks to OpenOS worker machines running
  -- cluster/openos/cluster-worker.lua. Tasks needing real I/O (fs,
  -- component, longer compute) belong on workers; the inline path is a
  -- tight no-I/O sandbox.
  worker_bridge_enabled    = false,

  -- Worker channel is raw OC modem on port 2001 + this domain. Every
  -- worker's /etc/cluster-worker.cfg must use the SAME domain_id.
  worker_bridge_domain     = 0,

  -- REQUIRED when the bridge is enabled. 16+ bytes, shared verbatim with
  -- each worker's `shared_secret` (#SEC H21/CR-3 — every frame is
  -- HMAC-authenticated; without it the bridge refuses to bind and a
  -- worker refuses to run tasks). Generate one with: `cat /dev/random` on
  -- a box with entropy, or any long random string you keep secret.
  worker_bridge_secret     = nil,

  -- Seconds the registration window stays open at startup. New worker
  -- addresses are only accepted during this window (after it closes, only
  -- already-known workers re-register). 0 keeps it closed.
  worker_bridge_bootstrap  = 180,

  -- "opt-in" → only tasks the Master marks via_bridge go to a worker.
  -- "prefer" → every task goes to an idle worker when one is free, else
  --            runs inline. Start with "opt-in".
  worker_bridge_mode       = "opt-in",

  -- Per-task timeout (seconds) for worker-dispatched tasks. A worker that
  -- doesn't answer in time yields a "timeout" result so an assignment
  -- never hangs on a dead worker.
  task_timeout_seconds     = 30,
}
